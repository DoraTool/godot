name: 🌐 Web Editor Deploy to Cloudflare R2
on:
  push:
    branches:
      - '4.4'
      - '4.5'
    tags:
      - '*'

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    tests=no
    debug_symbols=no
    use_closure_compiler=yes
  EM_VERSION: 4.0.11
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}

jobs:
  build-and-deploy-editor:
    runs-on: ubuntu-24.04
    name: Build and Deploy Web Editor
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten latest
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} threads=yes
          platform: web
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-editor
        continue-on-error: true

      - name: Verify build output
        run: |
          ls -la bin/.web_zip/
          echo "Build output verified"

      - name: Determine deploy path
        id: deploy-path
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract tag name (remove refs/tags/ prefix)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "path=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using tag as deploy path: $TAG_NAME"
          else
            # Extract branch name (remove refs/heads/ prefix)
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
            # Use commit SHA (short version)
            COMMIT_SHA="${GITHUB_SHA:0:7}"
            echo "path=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "Using branch: $BRANCH_NAME"
            echo "Using commit SHA as deploy path: $COMMIT_SHA"
          fi

      - name: Determine destination directory
        id: destination-dir
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # For tags, use tag name directly
            DEST_DIR="engine/${{ steps.deploy-path.outputs.path }}"
          else
            # For branches, prefix with branch name
            BRANCH_NAME="${{ steps.deploy-path.outputs.branch }}"
            DEST_DIR="$BRANCH_NAME/engine/${{ steps.deploy-path.outputs.path }}"
          fi
          echo "dir=$DEST_DIR" >> $GITHUB_OUTPUT
          echo "Destination directory: $DEST_DIR"

      - name: Print environment variables for debug
        run: |
          echo "=== Environment Variables ==="
          echo "S3_BUCKET: ${{ env.S3_BUCKET }}"
          echo "S3_ENDPOINT: ${{ env.S3_ENDPOINT }}"
          echo "Deploy path: ${{ steps.deploy-path.outputs.path }}"
          echo "Branch: ${{ steps.deploy-path.outputs.branch }}"
          echo "Destination dir: ${{ steps.destination-dir.outputs.dir }}"
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "============================"

      - name: Upload to Cloudflare R2
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ env.S3_BUCKET }}
          source_dir: bin/.web_zip
          destination_dir: ${{ steps.destination-dir.outputs.dir }}
          endpoint: ${{ env.S3_ENDPOINT }}

  build-and-deploy-runtime:
    runs-on: ubuntu-24.04
    name: Build and Deploy Web Runtime
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten latest
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-runtime
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: disable_3d=yes optimize=size threads=yes
          platform: web
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-runtime
        continue-on-error: true

      - name: Verify build output
        run: |
          ls -la bin/.web_zip/
          echo "Build output verified"

      - name: Determine deploy path
        id: deploy-path
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract tag name (remove refs/tags/ prefix)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "path=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using tag as deploy path: $TAG_NAME"
          else
            # Extract branch name (remove refs/heads/ prefix)
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
            # Use commit SHA (short version)
            COMMIT_SHA="${GITHUB_SHA:0:7}"
            echo "path=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "Using branch: $BRANCH_NAME"
            echo "Using commit SHA as deploy path: $COMMIT_SHA"
          fi

      - name: Determine destination directory
        id: destination-dir
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # For tags, use tag name directly
            DEST_DIR="runtime/${{ steps.deploy-path.outputs.path }}"
          else
            # For branches, prefix with branch name
            BRANCH_NAME="${{ steps.deploy-path.outputs.branch }}"
            DEST_DIR="$BRANCH_NAME/runtime/${{ steps.deploy-path.outputs.path }}"
          fi
          echo "dir=$DEST_DIR" >> $GITHUB_OUTPUT
          echo "Destination directory: $DEST_DIR"

      - name: Print environment variables for debug
        run: |
          echo "=== Environment Variables ==="
          echo "S3_BUCKET: ${{ env.S3_BUCKET }}"
          echo "S3_ENDPOINT: ${{ env.S3_ENDPOINT }}"
          echo "Deploy path: ${{ steps.deploy-path.outputs.path }}"
          echo "Branch: ${{ steps.deploy-path.outputs.branch }}"
          echo "Destination dir: ${{ steps.destination-dir.outputs.dir }}"
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "============================"

      - name: Upload to Cloudflare R2
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ env.S3_BUCKET }}
          source_dir: bin/.web_zip
          destination_dir: ${{ steps.destination-dir.outputs.dir }}
          endpoint: ${{ env.S3_ENDPOINT }}

